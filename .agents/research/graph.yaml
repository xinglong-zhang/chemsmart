    note: "The first approved Gaussian executions. Once `select_execution_wave` was surfaced from typed state and its description said that it runs the calculations, the same two goals -- re-issued unchanged, task text byte-identical -- found it, called it, and ran. g3 (H2O2, Slurm 2142407) and g4 (CH2O, 2142428) each relaxed a deliberately distorted geometry and took a single point on the structure the optimisation reached, each over two cycles with one revision admitted, and each settled `achieved` under the host completion gate. The opt of each reproduces the same calculation run through the human CLI to every printed digit: H2O2 identical reached geometry to 0.0 A and identical six frequencies, CH2O the same. Each single point ran on the reached structure and not the supplied one -- CH2O C=O 1.206270 A and H-C-H 115.220 degrees in both, energy agreeing to 1e-9 Eh. The measured order matters: with the flags false the same goal settles `returned_to_human` in twelve seconds with `bounded execution has no executable jobs`, before any planning, so the declaration cannot follow the run it admits."
