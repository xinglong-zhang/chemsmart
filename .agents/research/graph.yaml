  - id: negative.a_relaxed_scan_classified_itself_as_a_single_point
    kind: negative_result
    source: {path: ".agents/charter/other-programs-probe-providers.md", anchor: "written both for a relaxed scan and for a constrained optimisation, and a"}
    note: "A job type is a gate on every selector, so a misclassified result is an unreadable one. Gaussian's route-word chain matched the literal `opt=modred`, so `opt=(modredundant,maxstep=10)` fell past the `opt` branch (which excludes any route naming modred) and out of the chain as `sp` -- the spelling an archived real relaxed scan in this repository uses. The plainly spelled scan fared no better: it classified as `modred`, for which the reader declared nothing. Neither failure was visible as an error; both appeared as a completed result that answered nothing, or answered under another job's semantics."
    falsifier: "A completed Gaussian log whose ModRedundant section drives a coordinate is classified as anything but a scan, or one whose rows only freeze coordinates as anything but a constrained optimisation."

  - id: lesson.a_classification_written_into_a_setter_nothing_reads_was_never_made
    kind: lesson
    source: {path: "chemsmart/io/gaussian/output.py", anchor: "assignment reaches ``GaussianRoute.jobtype``'s setter, which"}
    note: "The scan/constrained-optimisation distinction had been computed for years: the Gaussian mixin assigns `self.jobtype = \"scan\"` while parsing the ModRedundant section. The assignment reaches a property setter that stores `_jobtype`, and that property's getter recomputes from the route and never reads the field. So the classification was not late or order-dependent -- it did not exist. This is the CONDUCT pattern `a value the host resolves and then discards leaves a boolean nothing can audit`, in a form where even the discarded value looked stored."
    falsifier: "A host value assigned through a property setter is read back by any consumer of that property without the getter being changed."

