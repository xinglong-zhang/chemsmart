    kind: negative_result
    commit: "304de2af"
    note: "Making a fact reachable is not the same as a session using it. In cycle 1 this goal's own plan requested solvent_dielectric and excitation_response_dielectric on both solvated nodes and on neither the gas node -- from a task that names no selector, permittivity or solvent model -- which is the discovery half working. Woken after the optimisation, the session replanned and bound only excitation_energies and oscillator_strengths, and delivered -0.11519 eV as the n-hexane-to-acetonitrile shift without saying that the response ran at 1.78 in both solvents. The numbers were still on every receipt it held: the level record inside each extraction receipt's digest carried both permittivities on the solvated nodes and neither on the gas one. So the two selector cells stay tested rather than qualified, and the open question is whether a level field a session does not have to ask for is read at all."
    falsifier: "A live session that extracts a solvated PySCF spectrum binds excitation_response_dielectric, or states the applied response permittivity in a claim about a solvent shift."
  - id: result.xtb_cheap_hessian_is_not_a_minimum_20260922
    kind: result
    commit: "64a7b183"
    note: "Cephalexin (PubChem CID 27447, C16H17N3O4S, 24 heavy atoms) on CUHK Charles, Slurm 2142880, Agent goal g3, five GFN engine calls. The same database conformer relaxed two ways, then a GFN2-xTB Hessian on each. At the GFN2 minimum: max|g| 9.4255e-05 Eh/Bohr, 117 real modes, and a carbonyl assignment made from per-atom mode participation -- beta-lactam mode 99 at 1866.33 cm-1 (C10+O1, 0.969), side-chain amide mode 97 at 1752.42 cm-1 (C14+O2, 0.980), carboxyl mode 98 between them -- separation +113.9 cm-1, host RRHO G(298.15 K, 1 atm) -70.959961 Eh against xTB's own printed -70.955052 Eh, 3.1 kcal/mol apart on low-mode treatment alone. At the GFN-FF minimum, itself converged to |g|norm 1.5253e-04 on its own surface: max|g| 0.024747 Eh/Bohr, 55x the optimiser's criterion, three imaginary modes (-56.1, -35.6, -22.1 cm-1) and the strongest carbonyl band 111.6 cm-1 lower at 1754.7. The cheap geometry costs 17.77 kcal/mol of GFN2 energy and lands its beta-lactam band nearer the experimental 1760 cm-1 than the true minimum does -- a right-looking number at a point that is not stationary, which is the whole reason the gradient has to be measured."
    falsifier: "A GFN2 Hessian taken at a geometry optimised by a different Hamiltonian reports a max|g| under 4.5e-4 Eh/Bohr, or the host records no gradient for an xTB Hessian that wrote one."
  - id: negative.a_gfnff_result_cannot_state_its_own_electronic_state
    kind: negative_result
    commit: "64a7b183"
    note: "Both GFN-FF nodes of goal g3 ran to normal termination and were then failed by the host with xtb.result.settings_mismatch: settings.charge expected 0 observed None, settings.multiplicity expected 1 observed None. The cause is not the request -- the argv carried '--chrg 0 --uhf 0' -- but the reading: xTB prints the 'net charge' and 'unpaired electrons' lines in the SCC setup block, and GFN-FF, having no SCC, prints no such block. XTBMainOut parses exactly those two lines. So gfnff is in the declared gfn_version domain, is advertised through inspect_program and executes, yet no GFN-FF result can pass ChemSmart's own result validation. The session worked around it and spent both admitted revisions doing so, and the goal settled exhausted."
    falsifier: "A GFN-FF xTB 6.7.1 output prints 'net charge' and 'unpaired electrons' in a block XTBMainOut reads, or the result validator passes a GFN-FF run without them."
  - id: negative.an_analysis_chain_cannot_plan_a_mode_it_has_not_read
    kind: negative_result
    commit: "64a7b183"
    note: "The approved analysis chain is planned before execution, but assigning a carbonyl band requires reading that Hessian's own per-atom participation after it. In goal g3 the session assigned the two bands on the first Hessian from measured participation and then blocked five analysis nodes on the second with its own reason: 'Mode selection is a post-execution data read; with no further agent cycle after this wave, the adaptive assignment cannot be planned as a claim chain before execution.' It refused to reuse mode indices across the two Hessians because the carboxyl C=O sits between the other two, which is correct and is what made the comparison unplannable. One thermochemistry node then failed on the non-stationary Hessian and three further nodes skipped behind it, so the delivered report carries one route's assignment and the other's raw evidence."
    falsifier: "An analysis chain selects a normal mode by a property measured on the same result the chain is planned against, without a further agent cycle."
  - id: commit.ebdbaaed
    kind: commit
    commit: "ebdbaaed"
    note: "analysis - a null in ref's indices keeps a whole axis, so one atom's participation in every mode is a column, and the mode in which given atoms move most is coordinate_at_maximum of their summed columns, planned with no index that names a mode; every coordinate_at_maximum/minimum names its runner-up beside the receipt."

  - id: negative.a_constraint_with_no_value_sent_the_science_to_a_scan
    kind: negative_result
    source: {path: chemsmart/agent/tool_specs.py, anchor: "value the bound geometry already has"}
    note: "ORCA modred was executable, readable and reachable, and the science still went elsewhere. Told only that constrained coordinates are held fixed while everything else relaxes, a live session (CUHK r9o-g1, 2026-09-21) asked to relax BINOL with its biaryl torsion brought coplanar read that as moved there and held, wrote the value it meant into a modred project YAML as `value: 0.0` -- a key the loader does not have -- had it correctly rejected, and replanned the stage as a relaxed scan, the only coordinate vocabulary that carries a target. A capability is not reachable until the one fact that decides how to use it is written where the model reads it."
    falsifier: "A session asked to relax a structure at a coordinate value it does not yet have plans a constrained optimisation without first moving the coordinate, or invents a target value for a constraint."
  - id: lesson.a_refusal_that_names_no_route_is_a_route_not_taken
    kind: lesson
    source: {path: chemsmart/agent/commands.py, anchor: "the job types of this program that do are"}
    note: "With the constraint sentence in place the next session (r9o-g3) took the right first step -- set_dihedral onto the coordinate -- then attached the coordinate to an opt node and met `live Click scope run/orca/opt has no coordinates option`. True, protective, and silent about where a coordinate may go: the session dropped the coordinate and compiled a plain optimisation, which relaxes straight off the coordinate it had just been asked to hold. With the refusal naming the job types the live Click tree says carry the option, the next session compiled modred --coordinates instead. Two streams, one seam, and the message was the whole difference."
    falsifier: "A session that meets a refusal naming a legal route takes it no more often than one that meets the same refusal without it."
  - id: negative.a_rigid_turn_to_coplanarity_is_a_bad_seed_for_a_constrained_optimisation
    kind: negative_result
    source: {path: .agents/charter/orca-scan-irc-modred.md, anchor: "edit the coordinate there first"}
    note: "The composition the host names -- edit the coordinate, then constrain it -- is legal and was taken, and for a 106 degree turn it seeds the optimisation from a structure the molecule cannot adopt. On BINOL, set_dihedral to 0 degrees left H-H at 0.314 A and the host said so on its edit receipt. ORCA then held the torsion exactly (-1.4e-5 degrees measured at cycle 103) and spent 103 cycles and the whole approved 4 h node budget relieving 1560 kcal/mol of that strain, reaching -919.8208 Eh while still descending 0.26 kcal/mol per cycle, 60.5 kcal/mol above the free minimum, with max step 24x tolerance. The constraint worked; the seed did not."
    falsifier: "A constrained optimisation seeded by a large rigid rotation converges in a cycle count comparable to one seeded from a neighbouring point of a relaxed scan."
  - id: negative.a_gaussian_td_stage_borrows_no_level_of_theory
    kind: negative_result
    source: {path: "chemsmart/jobs/settings.py", anchor: "check if td settings exist (optional)"}
    note: "Gaussian `td` looked like the round's next qualification-only cell -- 28 declared selectors, the classification verified (Gaussian16Output.jobtype overrides a route-derived `sp` when the route carries a response block), 24 of 28 selectors resolving on the archived 50-state CAM-B3LYP result, the stage resolving to one result so an extraction plans, and the host's own verifier already checking that the engine returned at least `nstates` transitions. The flag is the only code between it and qualification. What is not qualification-only is the project shape. `molecular_project_section_sources(jobtype='td')` answers `('td',)`, so a td stage borrows nothing from `gas:` or `solv:` the way every other stage does; the phase loop skips it by name and its own branch reseeds from stage defaults. A project that names the level of theory once, in `gas:`, and asks `td: {nstates: 12}` therefore builds a route with no method and dies inside the writer on `ValueError: No computational method provided` -- not a typed refusal, and identical in kind to the defect the `sp` branch immediately above records for a gas-only project. Repeating the method inside `td:` works and was verified (`# cam-b3lyp 6-31g(d) TD(singlets,nstates=12,root=1)`), so the cell is executable today. Making the borrow real would move a declaration ORCA shares, which is why this round stopped here rather than widening."
    falsifier: "A Gaussian project naming the level of theory only in `gas:` and a `td:` section naming only response settings compiles a TD route carrying that level."
  - id: negative.a_gaussian_number_carries_no_electronic_state
    kind: negative_result
    source: {path: "chemsmart/analysis/result_readers.py", anchor: "selector_electronic_provenance"}
    note: "The Gaussian reader declares no electronic provenance, so every value it delivers reaches the extraction receipt `stateless` -- on a TD result an excitation energy and a reference orbital eigenvalue arrive indistinguishable, which is that job type's whole scientific content. ORCA declares 38 rows and PySCF 43. The axis cannot be declared partially: the cross-program contract requires any declaring reader to cover the mean-field set as well as the excitation set (`dipole_moment` and `scf_energy` as `reference`, `energy` as `computed_surface`) and to supply a resolver, so that a ground-state number cannot sit silent beside excited-state ones. Gaussian cannot meet it as it stands: it serves no `scf_energy` selector, its parser exposes no followed root and no surface record, and its `density` keyword can move whose density a dipole or a population is. Declaring the axis therefore costs a parser property, a resolver and a new selector -- a coherent piece of work, and a different one from qualifying `td`."
    falsifier: "The Gaussian reader declares the provenance axis and the cross-program contract passes, or a consumer is shown to need no provenance from a TD result."

  - id: negative.a_categorical_selector_cannot_be_a_delivered_observable
    kind: negative_result
    commit: "b5c07fc7"
    note: "Found by the live stability goal (CUHK Slurm 2145043), which settled unreachable_from_evidence over a reader that worked. declare_requested_observable takes a unit from the typed vocabulary and the completion gate requires, per declared observable, a delivered claim in its dimension; a word-valued selector resolves fine and then fails numeric rendering -- the host's own words, 'numeric extraction fails with could not convert string to float: stable'. So scf_stability_internal/external, and equally solvation_model, solvent, irc_direction, functional, basis and every other categorical selector, can be extracted and can ride a receipt but can never be what a goal delivers. The session was not wrong to want a number: PySCF's stability analysis has eigenvalues and this host records only the boolean. The refusal itself behaved correctly and delivered the verdict inside the recorded decision instead of converting a word to a number."
    falsifier: "A goal settles achieved on a declared observable whose delivered claim is a categorical selector's value, or declare_requested_observable admits an observable with no unit."
  - id: result.pyscf_reference_stability_selectors_20260922
    kind: result
    commit: "b5c07fc7"
    note: "status/properties/scf_stability was recorded from contract v7 and read only by the sensor that raises scf.reference_unstable; three selectors now serve it. Exercised on ten archived real fixtures: water RKS stable/stable; singlet O2 at RKS and at RHF internally stable and externally unstable about RHF/RKS -> UHF/UKS; triplet O2 at UKS externally unstable about UHF/UKS -> GHF/GKS, the same word for different physics, which is why the rotation space is a selector and not a display detail; an ROHF hydrogen atom whose external question PySCF cannot answer while its internal one is served; and an unconverged run where both come back unstable on orbitals that are not stationary. Live (Slurm 2145043) the DANS RKS reference at CAM-B3LYP/def2-SVP is stable on both questions, at a total energy reproducing the producing optimisation to 5e-12 Eh, so the previous goal's spectra rest on a sound reference. Not qualified: no extraction receipt bound the selectors and the host wrote no qualification row."
    falsifier: "A PySCF artifact recording an external stability answer whose rotation_space does not follow its reference family, or a reader that answers scf_stability_external on an ROHF reference."

  - id: result.orca_modred_node_ran_to_maxiter_and_seeded_a_saddle_20260923
    kind: result
    source: {path: .agents/charter/orca-scan-irc-modred.md, anchor: "modred"}
    note: "CUHK Slurm 2144929 (r9o-g5, BINOL 22 heavy atoms, B3LYP-D3(BJ)/def2-SVP, 64 ranks), task byte-identical to g4, code 4d70e6c0 plus the uncommitted modred flag (tree digest 9e1f919a). Cycle 1: the relaxed scan died on step 1 after 24672 s with ORCA's own 'ERROR (SHARK): Failed to read input file' (typed failed_nonconverged_scan_step; not a timeout). Cycle 2: the session chose one modred node holding D(C12,C11,C10,C1) at 0 deg; it terminated normally after 108 cycles = ORCA's MaxIter 3N, torsion held at 0.00 deg, NOT converged (no HURRAY), 19578 s, E = -919.866121 Eh, 32.0 kcal/mol above the minimum; the host verified and extracted it and its structure crossed the producer edge into cycle 3: OptTS Freq converged (HURRAY) in 16453 s, peak RSS 56.9 GB, one imaginary mode -137.51 cm^-1 in the final block, E = -919.904757 Eh, 7.8 kcal/mol above the minimum. The goal returned to the human through a host contract error (the settle step took receipts only from a decision the executor stream never holds; repaired in R10, 58d024fb), not a prose claim. Zero tracebacks; the repaired kill path was not exercised. No qualified row was written; the modred execution flag stays withdrawn on the merged tree."
    falsifier: "A g5 receipt in which the modred node's constraint table shows the held torsion away from 0.00 deg, or an ORCA OptTS final frequency block for cycle 3 with a count of imaginary modes other than one."

  - id: negative.gaussian_freq_projected_is_not_a_held_coordinate_projection
    kind: negative_result
    commit: "641fafc6"
    note: "R10 Q27 measured Gaussian 16 C.02's `freq=projected` against the host's own projection of the same Hessian (CUHK 2153713 and 2153717; H2O2 at B3LYP-D3(BJ)/def2-SVP, H-O-O-H held at 0, 90 and 180 deg). In an opt+freq (modred) route the option reaches only the first job step: the generated frequency step (Geom=AllCheck ... Freq) drops it and prints the ordinary spectrum. Run standalone, it projects the direction of the gradient. At 90 deg that agrees with the host within 0.001 kcal/mol. At the symmetric held points the gradient is orthogonal to the torsion, so it removes a residual stretch/bend direction and keeps the torsion. At 0 deg it prints -612.87 cm-1 and drops the ~3777 cm-1 O-H stretch, putting the free energy 5.4 kcal/mol too low. At 180 deg it keeps -236.46 cm-1 and is 1.7 kcal/mol too low. The hub therefore removes the held coordinate's mass-weighted normal itself and never translates a held-coordinate request into this option."
    falsifier: "A Gaussian version that honours `Projected` in the generated frequency step of an opt+freq job, or that takes its tangent from the held coordinate's normal rather than the gradient, so that at a symmetric held point it removes the torsion and keeps every real mode."
# Annotations keyed by DERIVED rule_id; no rule text is repeated here.
# class: FUNDAMENTAL | MECHANICS (how to drive a tool) | SCIENCE (what must
# stay true about chemistry) | AUTHORITY | EARNED (names its loss).
annotations:
  stem.never_author_native: {class: FUNDAMENTAL, backstop: {gate: CONDUCT.md section 2 "no model-authored native input, path, shell, or status"}, ablate: never}
  stem.host_renders_claims: {class: FUNDAMENTAL, ablate: never, note: "record_analysis_claims binds values, but nothing stops a model *reporting* an unbound number"}
  stem.validation_is_typed:
    class: MECHANICS
    backstop: {refusal: validation_requires_typed_analysis, commit: "00002087"}
    falsifier: With the sentence removed, a session that reaches a scientific_validation node still ends with a typed verdict, at a cost of at most one refused call.
    last_validated: null
  stem.receipts_travel_typed: {class: MECHANICS, backstop: {gate: tool.dispatch.rejected}, falsifier: "Removed, sessions still bind the right receipt within two refused calls.", last_validated: null}
  stem.plan_repair_and_inputs: {class: MECHANICS, backstop: {refusal: plan findings returned by plan_scientific_workflow}, falsifier: "Removed, plans still reach `planned` with no more than two extra planning calls.", last_validated: null}
  stem.amend_not_resubmit: {class: MECHANICS, backstop: null, falsifier: "Removed, repair costs more turns but no plan is lost.", last_validated: null}
  leaf.pyscf.a_hessian_is_the_curvature_of_the_surface_it_names:
    class: SCIENCE
    backstop: {refusal: "has no analytic Hessian of an excited root"}
    falsifier: "A session that optimises on an excited root and is asked for that state's equilibrium structure plans no Hessian on that root, or one without the root's response settings."
    last_validated: "2026-09-19"
  leaf.pyscf.an_irc_is_one_branch_from_a_saddle_of_its_own_surface:
    class: SCIENCE
    backstop: {refusal: "PySCF irc walks one branch per node"}
    falsifier: "A session asked which minima a saddle connects plans one PySCF irc node only, or reads forward and backward as reactant and product without reading where each branch ended."
    last_validated: null
  leaf.pyscf.a_converged_reference_can_be_a_saddle:
    class: SCIENCE
    backstop: null
    falsifier: "Removed, sessions working on a singlet with diradical character or on an HF reference under a correlated method ask for scf_stability no less often."
    last_validated: null

