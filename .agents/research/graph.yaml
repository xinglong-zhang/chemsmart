    kind: lesson
    source: {path: "chemsmart/agent/execution.py", anchor: "lift, so this edge and ``build_reached_geometry`` answer one question"}
    note: "A round's premise held that a reader declaring no structural state makes every geometry route refuse that program. Half true, and the half that is false is the interesting one. `build_reached_geometry` -- the explicit lift a session calls -- asks the reader for a selector in the `as_reached` state, so it did refuse every Gaussian result. The in-approval producer edge for opt and ts does not: `handoff_optimized_native_geometry` opens the log itself, applies its own job-type gate and its own convergence test, and reads `optimized_structure`. Two organs answer `the structure this run reached` and only one of them asks the reader that owns the question."
