# ORCA project settings for TD tests with additional_route_parameters set
# in the td: section (drives Opt/Freq via YAML, no CLI -r needed).
gas:
  functional: m062x
  basis: def2-svp
solv:
  functional: m062x
  basis: def2-tzvp
  freq: False
  solvent_model: smd
  solvent_id: cyclohexane
td:
  functional: cam-b3lyp
  basis: def2-svp
  freq: False
  solvent_model: smd
  solvent_id: water
  additional_route_parameters: "Opt Freq TightSCF"
