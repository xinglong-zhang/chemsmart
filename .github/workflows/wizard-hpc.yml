name: wizard-hpc
# Tier 3 of the wizard's verification ladder: the real `chemsmart wizard`
# probes a REAL scheduler daemon, not a shim. Scheduled because a real
# daemon is slow to provision -- every push is still covered by the
# fixture suites and by the PATH-shim e2e (SLURM and PBS) in the main
# workflow.
#
# SLURM only. There is no maintained OpenPBS container image to verify
# against (the newest published pbspro image is a 2018 CentOS 7 build
# that cannot run a Python 3.10+ install), so a live PBS daemon remains
# unverified here; PBS stays covered by the canned-output parser suites
# and the shipped-binary PATH-shim e2e, and the docs say exactly that.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  wizard_against_real_slurm:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install a one-node SLURM cluster
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q \
            slurm-wlm munge

          # munge must hold a key before slurmctld will authenticate.
          if [ ! -s /etc/munge/munge.key ]; then
            sudo /usr/sbin/mungekey --create --force \
              || sudo create-munge-key -f
          fi
          sudo chown munge:munge /etc/munge/munge.key
          sudo chmod 400 /etc/munge/munge.key
          sudo systemctl restart munge

          CPUS="$(nproc)"
          MEM_MB="$(free -m | awk '/^Mem:/{print $2}')"
          # Emit one directive per echo: slurm.conf has no
          # line-continuation syntax, and a heredoc inside this indented
          # YAML block would prefix every line with the YAML indent.
          # SlurmUser must match the packaged unit's user (slurm), or
          # slurmctld refuses the state directory it cannot own; slurmd
          # stays root so it can launch jobs.
          {
            echo "ClusterName=ci"
            echo "SlurmctldHost=localhost"
            echo "SlurmUser=slurm"
            echo "SlurmdUser=root"
            echo "AuthType=auth/munge"
            echo "ProctrackType=proctrack/linuxproc"
            echo "TaskPlugin=task/none"
            echo "SchedulerType=sched/backfill"
            echo "SelectType=select/cons_tres"
            echo "SelectTypeParameters=CR_Core_Memory"
            echo "StateSaveLocation=/var/spool/slurmctld"
            echo "SlurmdSpoolDir=/var/spool/slurmd"
            echo "SlurmctldLogFile=/var/log/slurmctld.log"
            echo "SlurmdLogFile=/var/log/slurmd.log"
            echo "NodeName=localhost CPUs=${CPUS} RealMemory=${MEM_MB} State=UNKNOWN"
            echo "PartitionName=compute Nodes=localhost Default=YES MaxTime=2-00:00:00 State=UP"
          } | sudo tee /etc/slurm/slurm.conf > /dev/null

          # slurmctld refuses to start unless SlurmUser owns the state
          # directory (and it must not be group- or world-writable), and
          # it needs a log file it can open.
          sudo mkdir -p /var/spool/slurmctld /var/spool/slurmd
          sudo chown slurm:slurm /var/spool/slurmctld
          sudo chmod 0755 /var/spool/slurmctld
          sudo touch /var/log/slurmctld.log /var/log/slurmd.log
          sudo chown slurm:slurm /var/log/slurmctld.log

          sudo systemctl restart slurmctld slurmd || {
            echo "::group::slurmctld journal"
            sudo journalctl -xeu slurmctld --no-pager | tail -50 || true
            echo "::endgroup::"
            echo "::group::slurmd journal"
            sudo journalctl -xeu slurmd --no-pager | tail -50 || true
            echo "::endgroup::"
            exit 1
          }

          # The controller needs a moment before it answers queries.
          for _ in $(seq 30); do
            sinfo -h > /dev/null 2>&1 && break
            sleep 2
          done
          sinfo
          scontrol show partition compute

      - name: Install chemsmart with pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: The wizard reads the real scheduler
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          echo "WIZARD_HOME=$HOME" >> "$GITHUB_ENV"
          chemsmart wizard --server --yes | tee wizard.log
          CFG="$HOME/.chemsmart/server/SLURM.yaml"
          test -f "$CFG"
          grep -q "SCHEDULER: SLURM" "$CFG"
          grep -q "QUEUE_NAME: compute" "$CFG"
          grep -q "detected SLURM" "$CFG"
          # The chosen queue, not the login node, is the resource
          # authority: NUM_CORES must equal the partition's CPU count.
          CPUS="$(sinfo -h -o %c | head -1)"
          grep -q "NUM_CORES: $CPUS" "$CFG"
          grep -q "scheduler responds" wizard.log
          grep -q "submit command present" wizard.log

          # The written file renders a script the real controller
          # accepts (--test-only validates without executing anything).
          mkdir -p "$HOME/run" && cd "$HOME/run"
          printf '3\nwater\nO 0.0 0.0 0.1173\nH 0.0 0.7572 -0.4692\nH 0.0 -0.7572 -0.4692\n' > water.xyz
          chemsmart sub --test --fake -s SLURM xtb -p test -f water.xyz sp
          sbatch --test-only water_sp/chemsmart_sub_water_sp.sh

      - name: Upload the written configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wizard-slurm-yaml
          path: |
            ${{ env.WIZARD_HOME }}/.chemsmart/server/*.yaml
            wizard.log
          if-no-files-found: ignore
