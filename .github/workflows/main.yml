name: CI
# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: "3.10"
          environment-file: environment.yml
          activate-environment: chemsmart
          conda-solver: libmamba
          channel-priority: strict

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pip install -e .[dev,test,docs]

      - name: Show formatter versions
        run: |
          conda run -n chemsmart python -V
          conda run -n chemsmart black --version
          conda run -n chemsmart isort --version-number

      - name: Run pre-commit
        shell: bash -l {0}
        run: pre-commit run --all-files

  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: "3.10"
          environment-file: environment.yml
          activate-environment: chemsmart
          conda-solver: libmamba
          channel-priority: strict

      - name: Install build tools
        shell: bash -l {0}
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build package
        shell: bash -l {0}
        run: |
          rm -rf build dist
          python -m build

      - name: Check package
        shell: bash -l {0}
        run: |
          python -m twine check dist/*

      - name: Install the wheel into a bare venv and smoke it
        shell: bash -l {0}
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --quiet dist/*.whl
          /tmp/wheel-smoke/bin/chemsmart --version
          /tmp/wheel-smoke/bin/chemsmart --help > /dev/null
          /tmp/wheel-smoke/bin/python - <<'EOF'
          import importlib.resources as resources

          # The PyMOL style templates must ship in a clean wheel; runner.py
          # copies them by path and every visualization style fails without
          # them.
          templates = resources.files("chemsmart.jobs.mol") / "templates"
          names = {item.name for item in templates.iterdir()}
          assert "zhang_group_pymol_style.py" in names, sorted(names)

          # The TUI package must import without textual installed and give
          # the actionable extra hint when launched.
          import chemsmart.agent.tui  # noqa: F401
          EOF

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  tests_linux:
    needs: [pre-commit, build]
    if: ${{ success() }}

    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        os: [ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if only documentation changed
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            docs/**
            *.md

      - name: Report documentation-only change
        if: steps.changed-files.outputs.only_changed == 'true'
        run: |
          echo "Only documentation files changed; tests and coverage will be skipped."

      - name: Set up Conda
        if: steps.changed-files.outputs.only_changed != 'true'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: chemsmart
          conda-solver: libmamba
          channel-priority: strict

      - name: Install project
        if: steps.changed-files.outputs.only_changed != 'true'
        shell: bash -l {0}
        run: make install-dev

      - name: Run tests
        if: steps.changed-files.outputs.only_changed != 'true'
        shell: bash -l {0}
        run: make test

      - name: Verify coverage report
        if: >
          success() &&
          steps.changed-files.outputs.only_changed != 'true'
        shell: bash
        run: |
          echo "Working directory: $(pwd)"
          test -s coverage.xml
          echo "Coverage report generated:"
          ls -lh coverage.xml

      - name: Create coverage report
        if: >
          success() &&
          github.event_name == 'pull_request' &&
          !github.event.pull_request.head.repo.fork &&
          steps.changed-files.outputs.only_changed != 'true' &&
          hashFiles('coverage.xml') != ''
        uses: orgoro/coverage@v3
        with:
          coverageFile: coverage.xml
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload coverage artifacts
        if: >
          success() &&
          steps.changed-files.outputs.only_changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ runner.os }}
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: >
          success() &&
          steps.changed-files.outputs.only_changed != 'true' &&
          hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          disable_search: true
          fail_ci_if_error: false
          verbose: true

  tests_mac:
    needs: [pre-commit, build]
    if: ${{ success() }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        os: [macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if only documentation changed
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            docs/**
            *.md

      - name: Report documentation-only change
        if: steps.changed-files.outputs.only_changed == 'true'
        run: |
          echo "Only documentation files changed; tests and coverage will be skipped."

      - name: Set up Conda
        if: steps.changed-files.outputs.only_changed != 'true'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: chemsmart
          conda-solver: libmamba
          channel-priority: strict

      - name: Install project
        if: steps.changed-files.outputs.only_changed != 'true'
        shell: bash -l {0}
        run: make install-dev

      - name: Run tests
        if: steps.changed-files.outputs.only_changed != 'true'
        shell: bash -l {0}
        run: make test

  tests_win:
    needs: [pre-commit, build]
    if: ${{ success() }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10"]
        os: [windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check if only documentation changed
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            docs/**
            *.md

      - name: Report documentation-only change
        if: steps.changed-files.outputs.only_changed == 'true'
        shell: pwsh
        run: |
          Write-Host "Only documentation files changed; tests and coverage will be skipped."

      - name: Set up Conda
        if: steps.changed-files.outputs.only_changed != 'true'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          activate-environment: chemsmart
          conda-solver: libmamba
          channel-priority: strict

      - name: Install project
        if: steps.changed-files.outputs.only_changed != 'true'
        shell: bash -l {0}
        run: make install-dev

      - name: Run tests
        if: steps.changed-files.outputs.only_changed != 'true'
        shell: bash -l {0}
        run: make test

  pip_install_and_wizard:
    # The path a new academic user actually takes: plain pip, no conda.
    # Runs the dependency-clean core suites on every Python the metadata
    # claims, then the real `chemsmart wizard --server --yes` end to end
    # against PATH-shim scheduler binaries in an isolated HOME.
    needs: [pre-commit]
    if: ${{ success() }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install with pip only
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test,agent-tui]

      - name: Core suites
        run: |
          python -m pytest -q -p no:randomly \
            tests/agent tests/settings tests/test_server.py \
            tests/test_config.py tests/test_capabilities.py

      - name: Wizard onboarding e2e (PATH-shim scheduler)
        run: bash .github/scripts/wizard_shim_e2e.sh
