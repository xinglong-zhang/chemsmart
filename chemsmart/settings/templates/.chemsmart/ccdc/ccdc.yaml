# =============================================================================
# CSD / CCDC environment variables for the CSD Python API
#
# Using `Molecule.from_ccdc()` or the CLI option `-CC/--ccdc` requires the
# *licensed* CSD Python API (the `ccdc` package, csd-python-api) to be
# installed in the Python environment running chemsmart.
#
# Depending on how the CSD is installed, a number of environment variables
# must be set so that the API can locate the CSD data and files, see:
# https://downloads.ccdc.cam.ac.uk/documentation/API/installation_notes.html
#
# To use this file:
#   1. Copy it to ~/.chemsmart/ccdc/ccdc.yaml
#   2. Adapt the paths below to your local CSD installation
#   3. Uncomment the variables you need
#
# chemsmart reads this file and exports the variables into the environment
# before importing the `ccdc` package. Variables that are already set in the
# shell environment are NOT overwritten. Values may contain ~ (home directory)
# and $VARIABLES, which are expanded when the file is loaded.
# =============================================================================

# Root of the CCDC software installation
#CSDHOME: /home/user/CCDC/ccdc-software

# Set the variables required to locate the CSD data and files
#CCDC_ISOSTAR_DATA_DIRECTORY: /home/user/CCDC/ccdc-data/isostar
#CCDC_MOGUL_DATA: /home/user/CCDC/ccdc-data/mogul
#CCDC_MOGUL_INITIALISATION_FILE: $PYTHONHOME/lib/python3.9/site-packages/ccdc/parameter_files/mogul.ini
#CCDC_CROSSMINER_DATABASE: /home/user/CCDC/ccdc-data/crossminer/csd_pdb_crossminer.feat
#CCDC_CROSSMINER_FEATURE_DEFINITIONS: /home/user/CCDC/ccdc-data/crossminer/feature_definitions
#GOLD_DIR: /home/user/CCDC/ccdc-software/gold/GOLD

# On Windows, the paths typically look like (quote values containing
# backslashes or spaces):
#CSDHOME: 'C:\Program Files\CCDC'
#CCDC_MOGUL_DATA: 'C:\ProgramData\CCDC\ccdc-data\mogul'

# On macOS, the paths typically look like:
#CSDHOME: /Applications/CCDC
