# Default Gaussian settings for calculations for project ring strain (rs)
gas:
  dieze_tag: p  # comment/remove if not using
  functional: mn15
  basis: def2svp
solv:
  dieze_tag: p  # comment/remove if not using
  functional: mn15
  basis: def2qzvp
  freq: False
qmmm:
  dieze_tag: p  # comment/remove if not using
  high_level_functional: MN15
  high_level_basis: def2svp
  medium_level_functional: PBEPBE
  medium_level_basis: 6-31g(d,p)/auto
  low_level_force_field: AMBER=HardFirst