[build-system]
requires = ["setuptools==74.1.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chemsmart"
version = "3.1.4"
description = "CHEMSMART: Chemistry Simulation and Modeling Automation Toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.13"  # numpy 1.x has no cp313 wheels
authors = [{ name = "xinglong-zhang", email = "xinglong.zhang@cuhk.edu.hk" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "ase==3.24.0",
    "basis_set_exchange==0.11",
    "click==8.1.8",
    "dictdiffer==0.9.0",
    # Controller-side PySCF result inspection and fake previews use HDF5.
    # The PySCF/GPU4PySCF compute stack remains in its own environment.
    "h5py>=3.10,<4",
    "joblib==1.4.2",
    "networkx==3.4.2",
    "numpy~=1.26.4",  # rdkit and pymol require numpy 1.x
    "pyyaml",
    "pymatgen==2025.10.7",
    "rdkit==2025.3.3",
    "tomlkit==0.13.2",
    "scipy==1.15.2",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
    "requests>=2.32.3",
    "tenacity>=9.1.2",
    "matplotlib>=3.10.1",
    "scikit-learn>=1.6.1",
    "spyrmsd>=0.8.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-mock",
    "coverage",
    "pytest-cov",
]
dev = [
    "pre-commit>=3.6.0",
    "flake8",
    "ruff==0.15.22",
    "black==26.1.0",
    "isort==7.0.0",
    "gitchangelog",
    "pipreqs",
    "types-PyYAML",
]
docs = [
    "sphinx",
    "myst-parser",
    "sphinx-rtd-theme",
    "doc8",
    "rstcheck",
    "rstfmt",
]
agent-tui = [
    "textual>=8.2,<9",
    # The TUI imports rich directly; do not rely on it as a transitive.
    "rich>=13.7",
]

[project.urls]
homepage = "https://github.com/Hongjiseung-ROK/chemsmart/"
"Source" = "https://github.com/Hongjiseung-ROK/chemsmart/"

[project.scripts]
chemsmart = "chemsmart.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = [".github", "tests", "tests.*"]

[tool.setuptools.package-data]
"chemsmart" = [
    "VERSION",
    "settings/templates/**",
    "settings/templates/.chemsmart/**",
    "agent/tui/*.tcss",
]
# PyMOL style templates live in a non-package data directory; without
# this pattern a clean wheel drops them and every style copy fails.
"chemsmart.jobs.mol" = ["templates/*.py"]

[tool.flake8]
ignore = ["E226", "W503", "W504"]
extend-ignore = ["E203"]
per-file-ignores = {"__init__.py" = ["F401"]}
max-line-length = 79

[tool.ruff]
target-version = "py310"
line-length = 79

[tool.black]
line-length = 79
target-version = ["py310"]

[tool.isort]
profile = "black"
# The black profile defaults to 88; `make fmt` runs black at 79, so an
# import between the two widths would be rewrapped forever by whichever
# tool ran last and `make fmt` could never converge.
line_length = 79

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "--strict-markers --disable-warnings"
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
branch = true
source = ["chemsmart"]
